name: Build and deploy full game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out game sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore official engine downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .tools/godot
            .web-templates
          key: godot-4.7.2-web-${{ runner.os }}-v1
      - name: Fetch verified official engine
        run: python3 tools/fetch_godot.py --version 4.7.2 --output .tools/godot
      - name: Fetch matching official web template
        run: python3 tools/fetch_web_templates.py --version 4.7.2 --output .web-templates
      - name: Audit, import and build the complete game
        run: python3 tools/build_web.py --godot .tools/godot/Godot
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload complete website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
